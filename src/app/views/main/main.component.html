<app-toolbar />

<div class="container">
    @for (project of projects; track project.id) {
    <mat-card class="project-card" (click)="onOpenProject(project)" [class.disabled]="!project.link">
        <div class="header">
            <mat-icon class="icon material-symbols-outlined">{{project.matIcon}}</mat-icon>
            <span>{{project.title}}</span>
        </div>
    </mat-card>
    }
</div>
